server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Server-Sent Events: do not buffer, keep the connection open.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Demo only: lets the "Candidate phone" view read the mock WhatsApp inbox.
  location /whatsapp/ {
    proxy_pass http://mock-whatsapp:4001/;
  }

  location / {
    try_files $uri /index.html;
  }
}
